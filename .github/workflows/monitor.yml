name: Eslite Owala Stock Monitor

on:
  schedule:
    # 這裡使用 Cron 語法，設定每 15 分鐘自動執行一次 (UTC 時間)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊「即時測試執行」

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行監控腳本
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python monitor.py
