name: Eslite Owala Stock Monitor

on:
  schedule:
    # 每 30 分鐘自動執行一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v5  # 👈 這裡從 @v4 升級到 @v5，完美支援新版環境

    - name: 設定 Python 環境
      uses: actions/setup-python@v6 # 👈 這裡從 @v5 升級到 @v6，移除過時警告
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行監控腳本
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        ESLITE_URL: ${{ secrets.ESLITE_URL }}
        FINDERS_URLS: ${{ secrets.FINDERS_URLS }}
      run: |
        python monitor.py
